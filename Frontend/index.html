<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediKiosk — Ministry of AYUSH</title>
<style>
  :root{
    --paper:#F1F5EC;
    --paper-card:#FFFFFF;
    --teal:#0D3B36;
    --teal-deep:#081A17;
    --teal-mid:#144F48;
    --saffron:#D98F2B;
    --saffron-soft:#F5E2C4;
    --sage:#5B7E58;
    --ink:#14231D;
    --ink-soft:#48584E;
    --brick:#B4472A;
    --line:rgba(13,59,54,0.12);
    --line-dark:rgba(241,245,236,0.12);
    --shadow:0 2px 8px rgba(13,59,54,0.06), 0 10px 28px rgba(13,59,54,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100vh;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}

  /* Compact Top Bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{
    width:32px;height:32px;border-radius:8px;
    background:linear-gradient(155deg,var(--teal),var(--teal-mid));
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--teal);}
  .brand-sub{font-size:11px;color:var(--ink-soft);margin-top:-2px;}
  .top-btn{
    font-size:12px;color:var(--teal);font-weight:600;
    border:1px solid var(--line);padding:6px 14px;border-radius:20px;
    display:flex;align-items:center;gap:6px;cursor:pointer;background:#fff;
    transition:all .15s ease;
  }
  .top-btn:hover{background:var(--paper);border-color:var(--teal);}

  /* ── 100% ZOOM HOMEPAGE (COMPACT & BALANCED) ── */
  .home-stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px 24px;overflow:hidden;
  }
  .home-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;
    width:100%;max-width:880px;
  }
  @media(max-width:768px){
    .home-grid{grid-template-columns:1fr;gap:20px;text-align:center;}
  }

  .home-left{
    display:flex;flex-direction:column;justify-content:center;
  }
  .home-left .badge{
    display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--saffron);background:var(--saffron-soft);padding:3px 10px;border-radius:12px;margin-bottom:10px;
    width:fit-content;
  }
  .home-left h1{
    font-family:Georgia,serif;font-size:32px;color:var(--teal);line-height:1.15;margin:0 0 10px;
  }
  .home-left p{
    font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;max-width:360px;
  }
  .ayush-bullet{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);font-weight:500;margin-bottom:6px;
  }

  .home-right{display:flex;flex-direction:column;gap:12px;}
  .home-card{
    background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;
    box-shadow:var(--shadow);cursor:pointer;transition:all .18s ease;display:flex;align-items:center;gap:16px;
  }
  .home-card:hover{
    transform:translateY(-2px);border-color:var(--saffron);box-shadow:0 6px 18px rgba(13,59,54,0.1);
  }
  .home-card.doctor-card:hover{border-color:var(--teal);}
  .card-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .home-card.patient-card .card-icon{background:var(--saffron-soft);color:var(--teal);}
  .home-card.doctor-card .card-icon{background:var(--teal);color:#fff;}
  .card-text h3{font-size:15.5px;font-weight:700;color:var(--teal);margin:0 0 3px;}
  .card-text p{font-size:11.5px;color:var(--ink-soft);margin:0;line-height:1.35;}

  /* ── STAGES (FITS 100% ZOOM WITHOUT SCROLLING) ── */
  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:16px;overflow:hidden;
  }
  .kiosk-card{
    width:100%;max-width:480px;background:#fff;border-radius:20px;
    box-shadow:var(--shadow);padding:24px 26px;border:1px solid var(--line);
    max-height:86vh;display:flex;flex-direction:column;
  }
  .steps{display:flex;justify-content:center;gap:6px;margin:0 0 18px;}
  .step-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .3s;}
  .step-dot.active{background:var(--saffron);width:18px;border-radius:4px;}
  .step-dot.done{background:var(--sage);}

  h2.card-title{font-family:Georgia,serif;font-size:22px;line-height:1.2;margin:0 0 6px;color:var(--teal);}
  p.card-lede{font-size:13px;color:var(--ink-soft);line-height:1.45;margin:0 0 16px;}

  .lang-grid-6{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-bottom:16px;}
  .lang-opt{
    border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;
    cursor:pointer;background:var(--paper);transition:all .15s ease;
  }
  .lang-opt.selected{border-color:var(--saffron);background:var(--saffron-soft);}
  .lang-opt .native{font-family:Georgia,serif;font-size:15px;color:var(--teal);font-weight:600;}
  .lang-opt .sub{font-size:10px;color:var(--ink-soft);margin-top:1px;}

  .field{margin-bottom:11px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field input{
    width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);
    font-size:14px;background:var(--paper);color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--saffron);}
  .field-error{font-size:11px;color:var(--brick);margin-top:2px;}

  .radio-row{display:flex;gap:6px;}
  .radio-pill{
    flex:1;text-align:center;padding:8px;border-radius:8px;border:1.5px solid var(--line);
    font-size:12.5px;cursor:pointer;background:var(--paper);
  }
  .radio-pill.selected{border-color:var(--saffron);background:var(--saffron-soft);color:var(--teal);font-weight:600;}

  .consent-box{
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:12px;color:var(--ink-soft);line-height:1.45;margin-bottom:14px;
  }
  .check-row{display:flex;gap:8px;align-items:flex-start;cursor:pointer;margin-bottom:16px;}
  .check-row input{margin-top:2px;width:15px;height:15px;accent-color:var(--saffron);flex-shrink:0;}
  .check-row span{font-size:12px;color:var(--ink);line-height:1.4;}

  .btn{
    width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;
    cursor:pointer;transition:all .15s ease;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-mid);}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);margin-top:8px;}
  .btn-ghost:hover{background:var(--paper);}

  /* Chat */
  .chat-card{max-width:500px;}
  .chat-window{
    flex:1;min-height:220px;max-height:300px;overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding-right:4px;
  }
  .bubble-row{display:flex;align-items:flex-start;gap:8px;}
  .bubble-row.user{justify-content:flex-end;}
  .bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .bubble.bot{background:var(--paper);color:var(--ink);border-bottom-left-radius:3px;}
  .bubble.user{background:var(--teal);color:#fff;border-bottom-right-radius:3px;}
  .typing{display:flex;gap:4px;align-self:flex-start;padding:10px 14px;}
  .typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);animation:bounce 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-3px);opacity:1;}}

  .input-bar{display:flex;gap:6px;align-items:center;}
  .input-bar input{
    flex:1;padding:11px 14px;border-radius:20px;border:1.5px solid var(--line);
    font-size:13.5px;background:var(--paper);
  }
  .input-bar input:focus{outline:none;border-color:var(--saffron);}
  .mic-btn, .send-btn{
    width:38px;height:38px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .mic-btn{background:var(--paper);border:1.5px solid var(--line);}
  .mic-btn.listening{background:var(--brick);border-color:var(--brick);}
  .mic-btn svg{width:16px;height:16px;stroke:var(--teal);}
  .mic-btn.listening svg{stroke:#fff;}
  .send-btn{background:var(--saffron);}
  .send-btn svg{width:16px;height:16px;stroke:#fff;}
  .send-btn:disabled{background:var(--line);cursor:not-allowed;}

  .dropzone{
    border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;
    cursor:pointer;margin-bottom:12px;background:var(--paper);
  }
  .dropzone svg{width:24px;height:24px;stroke:var(--teal);margin-bottom:6px;}
  .dropzone p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .preview-row{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:10px;padding:10px;margin-bottom:12px;}
  .preview-row img{width:46px;height:46px;object-fit:cover;border-radius:6px;}
  .pdf-badge{width:46px;height:46px;background:#C0392B;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;}

  .gen-wrap{text-align:center;padding:30px 10px;}
  .gen-spinner{
    width:36px;height:36px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--saffron);margin:0 auto 16px;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── WAITING ROOM (COMPACT, 100% ZOOM FIT) ── */
  .waiting-card{
    width:100%;max-width:480px;background:#fff;border-radius:20px;
    box-shadow:var(--shadow);padding:24px 24px;border:1px solid var(--line);
    text-align:center;max-height:86vh;display:flex;flex-direction:column;justify-content:center;
  }
  .room-banner{
    background:linear-gradient(145deg, var(--teal), var(--teal-mid));
    color:#fff;padding:14px 16px;border-radius:14px;margin-bottom:14px;
  }
  .r-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--saffron-soft);}
  .r-main{font-family:Georgia,serif;font-size:24px;font-weight:700;margin:2px 0;}
  .r-sub{font-size:11px;color:rgba(255,255,255,0.8);}

  .token-timer-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;
  }
  .stat-box{background:var(--paper);border-radius:12px;padding:12px 10px;border:1px solid var(--line);}
  .stat-lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;font-weight:600;}
  .stat-val{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--teal);margin-top:2px;}
  .stat-val.timer{color:var(--brick);font-family:monospace;font-size:23px;}

  .doc-assigned-row{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:14px;
  }
  .doc-avatar{
    width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;
  }
  .doc-info h4{font-size:13.5px;font-weight:700;color:var(--teal);margin:0;}
  .doc-info p{font-size:11px;color:var(--ink-soft);margin:0;}
  .doc-info .badge{font-size:9.5px;font-weight:700;color:var(--saffron);text-transform:uppercase;}

  .meditate-hint{
    font-size:12px;font-style:italic;color:var(--ink-soft);line-height:1.45;margin-bottom:14px;
    background:rgba(217,143,43,0.08);padding:10px 12px;border-radius:10px;border:1px solid rgba(217,143,43,0.25);
  }

  .called-hero{
    background:#27ae60;color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px;
    box-shadow:0 0 24px rgba(39,174,96,0.5);animation:pulse 1.2s infinite alternate;
  }
  @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.02);}}

  /* Modal */
  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,26,23,0.8);
    backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;
  }
  .modal-card{
    background:#fff;width:100%;max-width:380px;border-radius:20px;padding:28px 24px;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .fun-error-badge{
    background:rgba(217,143,43,0.12);border:1px solid rgba(217,143,43,0.35);color:#92400e;
    padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.4;margin-bottom:14px;
    display:flex;align-items:flex-start;gap:6px;
  }

  /* Doctor Dashboard (Fits screen) */
  .dash{display:flex;height:100vh;background:var(--teal-deep);color:var(--paper);overflow:hidden;}
  .dash-sidebar{width:280px;border-right:1px solid var(--line-dark);padding:18px 0;display:flex;flex-direction:column;flex-shrink:0;}
  .dash-sidebar-header{padding:0 18px 14px;border-bottom:1px solid var(--line-dark);}
  .queue-scroll{flex:1;overflow-y:auto;}
  .queue-item{padding:12px 18px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;}
  .queue-item:hover{background:rgba(241,245,236,0.05);}
  .queue-item.active{background:rgba(217,143,43,0.12);border-left-color:var(--saffron);}
  .queue-item .qi-name{font-size:13.5px;font-weight:600;}
  .queue-item .qi-meta{font-size:11px;color:#9FB0A5;margin-top:1px;}

  .dash-main{flex:1;padding:24px 32px;display:flex;flex-direction:column;overflow-y:auto;}
  .dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .dash-header h1{font-family:Georgia,serif;font-size:22px;margin:0 0 2px;}
  .dash-header .dh-meta{font-size:12px;color:#9FB0A5;}
  .redflag-pill{background:rgba(180,71,42,0.25);color:#E9987F;border:1px solid rgba(180,71,42,0.5);padding:4px 10px;border-radius:14px;font-size:11.5px;font-weight:600;}

  .clinical-section{margin-bottom:14px;}
  .cs-label{font-size:11px;color:var(--saffron-soft);letter-spacing:.3px;margin-bottom:4px;}
  .cs-content{
    font-size:13.5px;line-height:1.5;background:rgba(241,245,236,0.04);
    border:1px solid var(--line-dark);border-radius:8px;padding:10px 12px;
    outline:none;color:var(--paper);min-height:36px;
  }
  .cs-content:focus{border-color:var(--saffron);}

  .dash-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-dark);}
  .dash-btn{padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;}
  .dash-btn.primary{background:var(--saffron);color:var(--teal-deep);}
  .dash-btn.success{background:#27ae60;color:#fff;}
  .dash-btn.ghost{background:transparent;border:1px solid var(--line-dark);color:var(--paper);}
  .dash-btn.danger{background:transparent;border:1px solid rgba(180,71,42,0.5);color:#E9987F;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:10px 20px;border-radius:24px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;}
  .toast.show{opacity:1;}
  .empty-detail{padding:40px 20px;text-align:center;color:#9FB0A5;font-size:13px;}
</style>
</head>

/* ── API CALLS ── */
async function apiDoctorLogin(docId, pin){
  try {
    var res = await fetch(BACKEND_URL + "/doctor/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doctor_id: docId, pin: pin })
    });
    if(res.ok) return await res.json();
  } catch(e){}
  return null;
}

async function apiStartSession(){
  try {
    var res = await fetch(BACKEND_URL + "/session/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: S.patient.name,
        age: String(S.patient.age),
        gender: S.patient.gender,
        phone: S.patient.phone,
        language: S.lang,
        mock_abha: S.patient.mock_abha || "91-4829-1029-4412"
      })
    });
    if(res.ok){
      var data = await res.json();
      S.sessionId = data.session_id;
      S.token = data.token;
      return true;
    }
  } catch(e){}
  S.sessionId = "local-" + Date.now();
  S.token = "B-" + (10 + Math.floor(Math.random()*40));
  return false;
}

async function apiChatNext(userMsg){
  userMsg = userMsg || "";
  try {
    var res = await fetch(BACKEND_URL + "/chat/next", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId, user_message: userMsg })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  if(!userMsg){
    return { question: t('chatTitle') + "?", done: false };
  }
  return { question: "", done: true };
}

async function apiUploadFile(file){
  try {
    var formData = new FormData();
    formData.append("file", file);
    var res = await fetch(BACKEND_URL + "/upload/document?session_id=" + encodeURIComponent(S.sessionId), {
      method: "POST",
      body: formData
    });
    if(res.ok) return (await res.json()).extracted;
  } catch(e){}
  return { summary: file.name + ' uploaded.', medicines: [], tests: [], date: 'Recent' };
}

async function apiGenerateSummary(){
  try {
    var res = await fetch(BACKEND_URL + "/summary/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  var firstUserMsg = S.messages.find(m => m.role === 'user');
  var cc = firstUserMsg ? firstUserMsg.text : "Consultation requested";

/* ── WAITING ROOM REAL COUNTDOWN & LIVE STATUS ── */
function startWaitingRoomEngines(){
  if(S.countdownTimer) clearInterval(S.countdownTimer);
  if(S.statusTimer) clearInterval(S.statusTimer);

  S.countdownTimer = setInterval(function(){
    if(S.countdownSeconds > 0 && !S.calledIn){
      S.countdownSeconds--;
      var el = document.getElementById('liveTimerVal');
      if(el) el.innerText = formatTime(S.countdownSeconds);
    }
  }, 1000);

  S.statusTimer = setInterval(async function(){
    if(!S.sessionId || S.view !== 'kiosk' || S.screen !== 'recap') return;
    try {
      var res = await fetch(BACKEND_URL + "/session/" + S.sessionId + "/status");
      if(res.ok){
        var data = await res.json();
        S.roomName = data.room || "OPD ROOM 2";
        S.deptName = data.department || "Kayachikitsa Wing";
        S.doctorName = data.doctor_name || "Dr. Mallard, MD (Ayu)";
        S.patientsAhead = (typeof data.patients_ahead !== 'undefined') ? data.patients_ahead : S.patientsAhead;
        
        var aheadEl = document.getElementById('liveAheadVal');
        if(aheadEl) aheadEl.innerText = S.patientsAhead;

        if(data.status === 'in_consultation' && !S.calledIn){
          S.calledIn = true;
          playChime();
          render();
        }
      }
    } catch(e){}
  }, 2500);
}

function formatTime(totalSecs){
  var m = Math.floor(totalSecs / 60);
  var s = totalSecs % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function playChime(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
    osc.start();
    osc.stop(ctx.currentTime + 1.4);
  } catch(e){}
}

/* ── FLOW CONTROLLERS ── */
function onPhoneInput(el){
  var val = el.value.replace(/\D/g, '');
  if(val.length > 10) val = val.slice(0, 10);
  el.value = val;
  S.patient.phone = val;
  if(val.length > 0 && val.length < 10){
    S.phoneError = S.lang==='hi' ? 'फ़ोन नंबर पूरे 10 अंकों का होना चाहिए' : 'Phone number must be exactly 10 digits';
  } else {
    S.phoneError = '';
  }
  var errEl = document.getElementById('phoneErr');
  if(errEl) errEl.innerText = S.phoneError;
  refreshBtn();
}

async function beginChat(){
  S.screen = 'chat'; S.messages = []; S.chatDone = false; render();
  await apiStartSession();
  S.awaitingReply = true; render();
  var res = await apiChatNext("");
  if(res && res.question){
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function sendAnswer(text){
  if(!text.trim() || S.awaitingReply) return;
  S.messages.push({ role:'user', text: text.trim() });
  S.awaitingReply = true; render();

  var res = await apiChatNext(text.trim());
  if(res.done || !res.question){
    S.chatDone = true;
  } else {
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function onFileChosen(ev){
  var file = ev.target.files[0];
  if(!file) return;

  S.uploadFile = file;
  S.uploadFileName = file.name;
  S.uploadIsPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  S.uploadStatus = 'scanning';
  render();

  if(!S.uploadIsPdf){
    var reader = new FileReader();
    reader.onload = function(e){ S.uploadPreview = e.target.result; render(); };
    reader.readAsDataURL(file);
  } else {
    S.uploadPreview = null;
    render();
  }

  var extracted = await apiUploadFile(file);
  S.extracted = extracted;
  S.uploadStatus = 'done';
  render();
}

async function generateSummary(){
  S.screen = 'generating'; render();
  var res = await apiGenerateSummary();
  S.clinicalSummary = res.clinical_summary;
  S.patientRecap = res.patient_recap || [];
  if(res.token) S.token = res.token;

  S.activeQueueId = S.sessionId;
  S.screen = 'recap';
  startWaitingRoomEngines();
  render();
}

function toggleMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("Microphone not supported in this browser"); return; }
  if(S.listening){
    if(S.recognition) S.recognition.stop();
    return;
  }
  var rec = new SR();
  var speechLangMap = {
    'en': 'en-IN', 'hi': 'hi-IN', 'ta': 'ta-IN', 'ml': 'ml-IN', 'gu': 'gu-IN', 'bn': 'bn-IN'
  };
  rec.lang = speechLangMap[S.lang] || 'en-IN';
  rec.interimResults = false;
  rec.onstart = function(){ S.listening = true; render(); };
  rec.onend = function(){ S.listening = false; render(); };
  rec.onerror = function(){ S.listening = false; render(); };
  rec.onresult = function(ev){
    var text = ev.results[0][0].transcript;
    var input = document.getElementById('chatInput');
    if(input) input.value = text;
  };
  S.recognition = rec;
  try{ rec.start(); }catch(e){ showToast("Mic error"); }
}

function showToast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

/* ── RENDERING ── */
function render(){
  var root = document.getElementById('root');
  if(!root) return;
  root.innerHTML = (S.view === 'dashboard' && S.doctorLoggedIn) ? renderDashboard() : renderKiosk();

  bindEvents();
}

function progressDots(){
  var order = ['welcome','details','consent','chat','upload'];
  var idx = order.indexOf(S.screen);
  var html = '<div class="steps">';
  for(var i=0; i<order.length; i++){
    var cls = 'step-dot' + (i===idx ? ' active' : (i<idx ? ' done' : ''));
    html += '<div class="' + cls + '"></div>';
  }
  return html + '</div>';
}

function renderKiosk(){
  var inner = '';

  var sidebarItems = '';

      '<div><div class="qi-name">' + escapeHtml(q.name) + '</div><div class="qi-meta">' + (q.meta || q.token) + '</div></div>' +

      '<div class="dash-sidebar-header">' +
        '<div class="brand" style="margin-bottom:8px;"><div class="brand-mark">' + logoSvg() + '</div>' +
        '<div><div class="brand-name" style="color:var(--paper);font-size:17px;">MediKiosk</div><div class="brand-sub" style="color:#9FB0A5;">' + (S.currentDoctor ? S.currentDoctor.doctor_name : 'Doctor OPD Portal') + '</div></div></div>' +

      (active ? (
        '<div class="dash-header"><div>' +
        '<h1>' + escapeHtml(active.name) + (active.age ? ', ' + active.age : '') + '</h1>' +
        '<div class="dh-meta">' + (active.gender==='F'?'Female':active.gender==='O'?'Other':'Male') + ' · Token: ' + (active.token || '') + '</div></div>' +

/* ── ACTIONS ── */
async function saveDoctorEdits(sessionId){
  var fields = ['chiefComplaint', 'hpi', 'pastHistory', 'allergies', 'medications', 'familyHistory', 'reviewOfSystems', 'uploadedDocSummary'];
  var updated = {};
  for(var i=0; i<fields.length; i++){
    var el = document.getElementById('field_' + fields[i]);
    if(el) updated[fields[i]] = el.innerText.trim();
  }
  showToast('Saving edits to server...');
  var ok = await apiSaveSummary(sessionId, updated);
  if(ok){
    showToast('Edits successfully saved ✓');
    apiGetQueue();
  }
}

async function callPatient(sessionId){
  showToast('Calling patient into room...');
  var ok = await apiApprovePatient(sessionId);
  if(ok){
    showToast('Patient notified and called in ✓');
    apiGetQueue();
  }
}

async function completeVisit(sessionId){
  if(!confirm("Mark consultation complete and archive patient from queue?")) return;
  showToast('Completing consultation...');
  var ok = await apiCompletePatient(sessionId);
  if(ok){
    showToast('Visit completed and archived ✓');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

async function deletePatientRecord(sessionId){
  if(!confirm("Are you sure you want to delete this patient from the waiting list?")) return;
  showToast('Deleting patient...');
  var ok = await apiDeletePatient(sessionId);
  if(ok){
    showToast('Patient deleted from queue');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

function printCaseSheet(){ window.print(); }

function bindEvents(){
  var cw = document.getElementById('chatWindow');
  if(cw) cw.scrollTop = cw.scrollHeight;
  var ci = document.getElementById('chatInput');
  if(ci) ci.focus();
}

function refreshBtn(){
  var p = S.patient;
  var isPhoneValid = !p.phone || p.phone.length === 10;
  var db = document.getElementById('detailsBtn');
  if(db) db.disabled = !(p.name.trim() && p.age && isPhoneValid);
  var cb = document.getElementById('consentBtn');
  if(cb) cb.disabled = !S.consent;
}
function goto(screen){ S.screen = screen; render(); }
function submitChat(){
  var input = document.getElementById('chatInput');
  if(!input) return;
  var val = input.value;
  input.value = '';
  sendAnswer(val);
}
function setActiveQueue(id){ S.activeQueueId = id; render(); }
function resetKiosk(){
  S.screen='landing'; S.patient={name:'',age:'',gender:'M',phone:'',mock_abha:''}; S.consent=false;
  S.sessionId=null; S.token=null; S.messages=[]; S.chatDone=false;
  S.uploadFile=null; S.uploadFileName=''; S.uploadIsPdf=false; S.uploadPreview=null;
  S.uploadStatus='idle'; S.extracted=null; S.clinicalSummary=null; S.patientRecap=null;
  S.calledIn=false;
  if(S.countdownTimer) clearInterval(S.countdownTimer);
  if(S.statusTimer) clearInterval(S.statusTimer);
  render();
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
