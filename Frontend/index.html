<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediKiosk — Ministry of AYUSH</title>
<style>
  :root{
    --paper:#F1F5EC;
    --paper-dim:#E7EEDF;
    --teal:#0D3B36;
    --teal-deep:#0B1A17;
    --teal-mid:#144F48;
    --saffron:#D98F2B;
    --saffron-soft:#F3D9AE;
    --sage:#6E8F6B;
    --ink:#16231D;
    --ink-soft:#4B5A50;
    --brick:#B4472A;
    --line:rgba(22,35,29,0.14);
    --line-dark:rgba(241,245,236,0.14);
    --shadow:0 1px 3px rgba(13,59,54,0.06), 0 10px 30px rgba(13,59,54,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  .serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--teal),var(--teal-mid));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:Georgia,serif;font-size:19px;font-weight:700;color:var(--teal);}
  .brand-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-2px;}

  /* Main split container */
  .stage-split{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px 24px 60px;max-width:1160px;margin:0 auto;width:100%;gap:48px;
  }
  .hero-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:480px;}
  .hero-img{width:100%;max-width:420px;height:auto;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(13,59,54,0.09));}

  .card-side{width:100%;max-width:480px;}
  .card{
    background:#fff;border-radius:24px;box-shadow:var(--shadow);
    padding:34px 28px;border:1px solid var(--line);width:100%;
  }

  /* Role Selection Cards */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  .role-box{
    border:1.5px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;
    background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    min-height:220px;transition:all .18s ease;
  }
  .role-box.patient-box{background:#f0f7f3;border-color:rgba(110,143,107,0.3);}
  .role-box.doctor-box{background:#fbf5ed;border-color:rgba(217,143,43,0.3);}
  .role-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .patient-box .role-icon{background:rgba(110,143,107,0.2);color:var(--teal);}
  .doctor-box .role-icon{background:rgba(217,143,43,0.2);color:#92400e;}
  .role-title{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--teal);margin-bottom:6px;}
  .role-desc{font-size:12px;color:var(--ink-soft);line-height:1.45;margin-bottom:14px;}
  .role-btn{
    width:100%;padding:10px 12px;border-radius:10px;border:none;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .patient-btn{background:var(--teal);color:#fff;}
  .doctor-btn{background:#92400e;color:#fff;}

  /* Ayush Footer */
  .ayush-footer{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    text-align:center;font-size:10.5px;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase;
  }
  .ayush-sub{font-size:9px;color:var(--sage);margin-top:4px;letter-spacing:.6px;}

  /* Kiosk Steps */
  .steps{display:flex;justify-content:center;gap:8px;margin:0 0 26px;}
  .step-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s ease;}
  .step-dot.active{background:var(--saffron);width:20px;border-radius:4px;}
  .step-dot.done{background:var(--sage);}

  h1.title{font-family:Georgia,serif;font-size:24px;line-height:1.25;margin:0 0 8px;color:var(--teal);}
  p.lede{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 22px;}

  /* Language Grid */
  .lang-grid-6{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:16px;}
  @media(max-width:480px){.lang-grid-6{grid-template-columns:repeat(2, 1fr);}}
  .lang-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;
    cursor:pointer;background:var(--paper);transition:all .15s ease;
  }
  .lang-opt.selected{border-color:var(--saffron);background:var(--saffron-soft);}
  .lang-opt .lang-native{font-family:Georgia,serif;font-size:16px;color:var(--teal);font-weight:600;}
  .lang-opt .lang-eng{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;background:var(--paper);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--saffron);}

  .radio-row{display:flex;gap:8px;}
  .radio-pill{flex:1;text-align:center;padding:9px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;background:var(--paper);}
  .radio-pill.selected{border-color:var(--saffron);background:var(--saffron-soft);color:var(--teal);font-weight:600;}

  .consent-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:16px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
  .check-row input{margin-top:3px;width:15px;height:15px;accent-color:var(--saffron);flex-shrink:0;}
  .check-row span{font-size:13px;color:var(--ink);line-height:1.45;}

  .btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-mid);}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);margin-top:10px;}
  .btn-ghost:hover{background:var(--paper);}

  /* Chat */
  .chat-card{max-width:520px;}
  .chat-window{min-height:280px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.5;}
  .bubble.bot{background:var(--paper);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble.user{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .typing{display:flex;gap:4px;align-self:flex-start;padding:12px 15px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:bounce 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  .input-bar{display:flex;gap:8px;align-items:center;}
  .input-bar input{flex:1;padding:12px 16px;border-radius:24px;border:1.5px solid var(--line);font-size:14px;background:var(--paper);}
  .input-bar input:focus{outline:none;border-color:var(--saffron);}
  .mic-btn, .send-btn{width:42px;height:42px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .mic-btn{background:var(--paper);border:1.5px solid var(--line);}
  .mic-btn.listening{background:var(--brick);border-color:var(--brick);}
  .mic-btn svg{width:18px;height:18px;stroke:var(--teal);}
  .mic-btn.listening svg{stroke:#fff;}
  .send-btn{background:var(--saffron);}
  .send-btn svg{width:18px;height:18px;stroke:#fff;}
  .send-btn:disabled{background:var(--line);cursor:not-allowed;}

  .dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;margin-bottom:14px;background:var(--paper);}

  /* Waiting Room Styles (Matching Image 4) */
  .wait-card{padding:26px 24px;}
  .doc-info-row{
    background:#f4f8f4;border:1px solid rgba(110,143,107,0.3);border-radius:14px;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  }
  .doc-avatar{width:42px;height:42px;border-radius:50%;background:#e2ece3;display:flex;align-items:center;justify-content:center;color:var(--teal);margin-right:12px;}
  .doc-name{font-weight:700;font-size:15px;color:var(--teal);}
  .doc-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .token-pill{background:var(--teal);color:#fff;border-radius:20px;padding:6px 16px;text-align:center;}
  .token-pill-label{font-size:10px;text-transform:uppercase;color:#9fb0a5;letter-spacing:.4px;}
  .token-pill-val{font-size:18px;font-weight:800;font-family:Georgia,serif;letter-spacing:1px;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .stat-card{border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;}
  .stat-card.green{background:#f0f7f3;border:1px solid rgba(110,143,107,0.3);}
  .stat-card.peach{background:#fbf5ed;border:1px solid rgba(217,143,43,0.3);}
  .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .stat-card.green .stat-icon{background:#e0ede4;color:var(--teal);}
  .stat-card.peach .stat-icon{background:#f5ebd9;color:#92400e;}
  .stat-label{font-size:11px;color:var(--ink-soft);}
  .stat-val{font-size:18px;font-weight:800;color:var(--teal);margin-top:1px;}
  .stat-card.peach .stat-val{color:#92400e;}

  .queue-list-head{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
  .queue-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .queue-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;background:#fff;}
  .queue-row:last-child{border-bottom:none;}
  .queue-row:nth-child(even){background:var(--paper);}
  .mini-token{background:#e7eedf;color:var(--teal);font-weight:700;font-size:11.5px;padding:3px 8px;border-radius:6px;}

  .wait-banner{
    background:#eef5ec;border:1px solid rgba(110,143,107,0.4);color:var(--teal-mid);
    padding:12px 14px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:8px;
  }
  .call-alert-banner{
    background:#27ae60;color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;
    animation:pulseCall 1.2s infinite alternate;text-align:center;
  }
  @keyframes pulseCall{from{box-shadow:0 0 0 rgba(39,174,96,0.3);}to{box-shadow:0 0 20px rgba(39,174,96,0.8);}}

  /* Modal */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(11,26,23,0.78);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-card{background:#fff;width:100%;max-width:390px;border-radius:20px;padding:32px 26px;box-shadow:var(--shadow);}
  .fun-error-badge{background:rgba(217,143,43,0.12);border:1px solid rgba(217,143,43,0.35);color:#92400e;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.45;margin-bottom:14px;}

  /* Doctor Dashboard */
  .dash{display:flex;min-height:100vh;background:var(--teal-deep);color:var(--paper);}
  .dash-sidebar{width:300px;border-right:1px solid var(--line-dark);padding:24px 0;flex-shrink:0;}
  .dash-sidebar-header{padding:0 20px 18px;border-bottom:1px solid var(--line-dark);margin-bottom:10px;}
  .dash-sidebar-header .dsh-label{font-size:11px;color:var(--saffron-soft);letter-spacing:.3px;}
  .queue-item{padding:14px 20px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;transition:all .15s;}
  .queue-item:hover{background:rgba(241,245,236,0.05);}
  .queue-item.active{background:rgba(217,143,43,0.12);border-left-color:var(--saffron);}
  .queue-item .qi-name{font-size:14px;font-weight:600;}
  .queue-item .qi-meta{font-size:11.5px;color:#9FB0A5;margin-top:2px;}

  .dash-main{flex:1;padding:32px 40px;max-width:780px;}
  .dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
  .dash-header h1{font-family:Georgia,serif;font-size:26px;margin:0 0 4px;}
  .dash-header .dh-meta{font-size:13px;color:#9FB0A5;}
  .redflag-pill{background:rgba(180,71,42,0.18);color:#E9987F;border:1px solid rgba(180,71,42,0.4);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .clinical-section{margin-bottom:22px;}
  .cs-label{font-size:11.5px;color:var(--saffron-soft);letter-spacing:.3px;margin-bottom:6px;}
  .cs-content{font-size:14.5px;line-height:1.6;background:rgba(241,245,236,0.04);border:1px solid var(--line-dark);border-radius:10px;padding:14px 16px;outline:none;color:var(--paper);min-height:48px;}
  .cs-content:focus{border-color:var(--saffron);}
  .dash-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line-dark);}
  .dash-btn{padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;}
  .dash-btn.primary{background:var(--saffron);color:var(--teal-deep);}
  .dash-btn.success{background:#27ae60;color:#fff;}
  .dash-btn.ghost{background:transparent;border:1px solid var(--line-dark);color:var(--paper);}
  .dash-btn.danger{background:transparent;border:1px solid rgba(180,71,42,0.5);color:#E9987F;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:999;}
  .toast.show{opacity:1;}
  .empty-detail{padding:60px 20px;text-align:center;color:#9FB0A5;font-size:14px;}

  @media(max-width:880px){
    .stage-split{flex-direction:column;gap:24px;}
    .hero-side{display:none;} /* On small mobile, show just card */
    .card-side{max-width:100%;}
  }
</style>
</head>

/* ── API CALLS ── */
async function apiDoctorLogin(docId, pin){
  try {
    var res = await fetch(BACKEND_URL + "/doctor/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doctor_id: docId, pin: pin })
    });
    if(res.ok) return await res.json();
  } catch(e){}
  return null;
}

async function apiStartSession(){
  try {
    var res = await fetch(BACKEND_URL + "/session/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: S.patient.name,
        age: String(S.patient.age),
        gender: S.patient.gender,
        phone: S.patient.phone,
        language: S.lang,
        mock_abha: "91-4829-1029-4412"
      })
    });
    if(res.ok){
      var data = await res.json();
      S.sessionId = data.session_id;
      S.token = data.token;
      return true;
    }
  } catch(e){}
  S.sessionId = "local-" + Date.now();
  S.token = "B-" + (10 + Math.floor(Math.random()*40));
  return false;
}

async function apiChatNext(userMsg){
  userMsg = userMsg || "";
  try {
    var res = await fetch(BACKEND_URL + "/chat/next", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId, user_message: userMsg })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  if(!userMsg){
    return { question: t('chatTitle') + "?", done: false };
  }
  return { question: "", done: true };
}

async function apiUploadFile(file){
  try {
    var formData = new FormData();
    formData.append("file", file);
    var res = await fetch(BACKEND_URL + "/upload/document?session_id=" + encodeURIComponent(S.sessionId), {
      method: "POST",
      body: formData
    });
    if(res.ok) return (await res.json()).extracted;
  } catch(e){}
  return { summary: file.name + ' uploaded.', medicines: [], tests: [], date: 'Recent' };
}

async function apiGenerateSummary(){
  try {
    var res = await fetch(BACKEND_URL + "/summary/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  var firstUserMsg = S.messages.find(m => m.role === 'user');
  var cc = firstUserMsg ? firstUserMsg.text : "Consultation requested";
  return {
    token: S.token,
    clinical_summary: {
      chiefComplaint: cc,
      hpi: S.messages.map(m => (m.role==='bot'?'Dr: ':'Pt: ') + m.text).join('\n'),
      pastHistory: "None reported.",
      allergies: "None reported.",
      medications: "Reported in intake",
      familyHistory: "Not contributory.",
      reviewOfSystems: "Normal",
      redFlags: "None flagged.",
      uploadedDocSummary: "No document uploaded."
    }
  };
}

async function apiGetQueue(){
  try {
    var res = await fetch(BACKEND_URL + "/doctor/queue");
    if(res.ok){
      var data = await res.json();
      S.queue = data.queue;
      if(!S.activeQueueId && S.queue.length > 0){
        S.activeQueueId = S.queue[0].session_id;
      }
      render();
    }
  } catch(e){}
}

async function apiSaveSummary(sessionId, summaryObj){

    var res = await fetch(BACKEND_URL + "/doctor/session/" + sessionId + "/summary", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clinical_summary: summaryObj })
    });
    return res.ok;
  } catch(e){ return false; }
}

async function apiDeletePatient(sessionId){

    var res = await fetch(BACKEND_URL + "/doctor/session/" + sessionId, { method: "DELETE" });
    return res.ok;
  } catch(e){ return false; }
}

function startPollingStatus(){
  if(S.statusTimer) clearInterval(S.statusTimer);
  S.statusTimer = setInterval(async function(){
    if(!S.sessionId || S.view !== 'patient' || S.screen !== 'waiting') return;
    try {
      var res = await fetch(BACKEND_URL + "/session/" + S.sessionId + "/status");
      if(res.ok){
        var data = await res.json();
        S.waitData.people_ahead = data.people_ahead;
        S.waitData.estimated_wait_mins = data.estimated_wait_mins;
        if(data.next_queue && data.next_queue.length) S.waitData.next_queue = data.next_queue;
        if(data.doctor_name) S.waitData.doctor_name = data.doctor_name;

        if(data.status === 'in_consultation' && !S.calledIn){
          S.calledIn = true;
          S.roomName = data.room || "OPD Consultation Room 2";
          playChime();
        }
        render();
      }
    } catch(e){}
  }, 3000);
}

function playChime(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch(e){}
}

/* ── FLOW CONTROLLERS ── */
function onPhoneInput(el){
  var val = el.value.replace(/\D/g, '');
  if(val.length > 10) val = val.slice(0, 10);
  el.value = val;
  S.patient.phone = val;
  refreshBtn();
}

function startPatientFlow(){
  S.view = 'patient';
  S.screen = 'welcome';
  render();
}

async function beginChat(){
  S.screen = 'chat'; S.messages = []; S.chatDone = false; render();
  await apiStartSession();
  S.awaitingReply = true; render();
  var res = await apiChatNext("");
  if(res && res.question){
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function sendAnswer(text){
  if(!text.trim() || S.awaitingReply) return;
  S.messages.push({ role:'user', text: text.trim() });
  S.awaitingReply = true; render();

  var res = await apiChatNext(text.trim());
  if(res.done || !res.question){
    S.chatDone = true;
  } else {
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function onFileChosen(ev){
  var file = ev.target.files[0];
  if(!file) return;

  S.uploadFile = file;
  S.uploadFileName = file.name;
  S.uploadIsPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  S.uploadStatus = 'scanning';
  render();

  var extracted = await apiUploadFile(file);
  S.extracted = extracted;
  S.uploadStatus = 'done';
  render();
}

async function generateSummaryAndEnterWaitingRoom(){
  S.screen = 'generating'; render();
  var res = await apiGenerateSummary();
  S.clinicalSummary = res.clinical_summary;
  if(res.token) S.token = res.token;

  S.screen = 'waiting';
  startPollingStatus();
  render();
}

function toggleMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("Microphone not supported in this browser"); return; }
  if(S.listening){
    if(S.recognition) S.recognition.stop();
    return;
  }
  var rec = new SR();
  var speechLangMap = {'en':'en-IN','hi':'hi-IN','ta':'ta-IN','ml':'ml-IN','gu':'gu-IN','bn':'bn-IN'};
  rec.lang = speechLangMap[S.lang] || 'en-IN';
  rec.interimResults = false;
  rec.onstart = function(){ S.listening = true; render(); };
  rec.onend = function(){ S.listening = false; render(); };
  rec.onerror = function(){ S.listening = false; render(); };
  rec.onresult = function(ev){
    var text = ev.results[0][0].transcript;
    var input = document.getElementById('chatInput');
    if(input) input.value = text;
  };
  S.recognition = rec;
  try{ rec.start(); }catch(e){ showToast("Mic error"); }
}

function showToast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

/* ── RENDERING ROUTER ── */
function render(){
  var root = document.getElementById('root');
  if(!root) return;

  if(S.view === 'dashboard' && S.doctorLoggedIn){
    root.innerHTML = renderDashboard();
  } else if(S.view === 'patient'){
    root.innerHTML = renderPatientFlow();
  } else {
    root.innerHTML = renderLandingPage();
  }

  if(S.showDoctorModal) renderDoctorModal();
  bindEvents();
}

function openDoctorModal(){ S.showDoctorModal = true; S.loginError = ''; render(); }
function closeDoctorModal(){
  S.showDoctorModal = false;
  var el = document.getElementById('docModal');
  if(el) el.remove();
}

async function submitDoctorLogin(){
  var docId = document.getElementById('docIdInput').value;
  var pin = document.getElementById('docPinInput').value;
  var res = await apiDoctorLogin(docId, pin);
  if(res && res.success){
    S.doctorLoggedIn = true;
    S.currentDoctor = res;
    closeDoctorModal();
    S.view = 'dashboard';
    apiGetQueue();
    render();
  } else {
    S.loginError = 'wrong';
    var el = document.getElementById('docModal');
    if(el) el.remove();
    renderDoctorModal();
  }
}

function doctorLogout(){
  S.doctorLoggedIn = false;
  S.currentDoctor = null;
  S.view = 'landing';
  S.screen = 'role';
  render();
  showToast('Logged out of Doctor Portal');
}

/* ── 5. DOCTOR DASHBOARD (LOCKED, NO SWITCH TO KIOSK) ── */
function renderDashboard(){
  var active = null;
  for(var i=0; i<S.queue.length; i++){
    if(S.queue[i].session_id === S.activeQueueId){ active = S.queue[i]; break; }
  }
  if(!active && S.queue.length > 0) active = S.queue[0];

  var sidebarItems = '';
  for(var j=0; j<S.queue.length; j++){
    var q = S.queue[j];
    var isSel = (active && q.session_id === active.session_id);
    sidebarItems += '<div class="queue-item ' + (isSel ? 'active' : '') + '" onclick="setActiveQueue(\'' + q.session_id + '\')">' +
      '<div><div class="qi-name">' + escapeHtml(q.name) + '</div><div class="qi-meta">' + (q.meta || q.token) + '</div></div>' +
      (q.status === 'in_consultation' ? '<span style="font-size:10px;background:#27ae60;color:#fff;padding:2px 8px;border-radius:10px;font-weight:bold;">In Room</span>' : '') +
      '</div>';
  }

  var c = active ? active.clinical : null;
  var sectionsHtml = '';
  if(c){
    var arr = [
      ['Chief complaint', 'chiefComplaint', c.chiefComplaint],
      ['History of present illness', 'hpi', c.hpi],
      ['Past history', 'pastHistory', c.pastHistory],
      ['Allergies', 'allergies', c.allergies],
      ['Current medications', 'medications', c.medications],
      ['Family history', 'familyHistory', c.familyHistory],
      ['Review of systems', 'reviewOfSystems', c.reviewOfSystems],
      ['Uploaded document summary', 'uploadedDocSummary', c.uploadedDocSummary || 'No document uploaded.']
    ];
    for(var k=0; k<arr.length; k++){
      sectionsHtml += '<div class="clinical-section">' +
        '<div class="cs-label">' + arr[k][0].toUpperCase() + '</div>' +
        '<div class="cs-content" contenteditable="true" id="field_' + arr[k][1] + '">' + escapeHtml(arr[k][2] || '—') + '</div>' +
        '</div>';
    }
  }

  return '<div class="dash">' +
    '<div class="dash-sidebar">' +
      '<div class="dash-sidebar-header">' +
        '<div class="brand" style="margin-bottom:10px;"><div class="brand-mark">' + logoSvg() + '</div>' +
        '<div><div class="brand-name" style="color:var(--paper);">MediKiosk</div><div class="brand-sub" style="color:#9FB0A5;">' + (S.currentDoctor ? S.currentDoctor.doctor_name : 'Doctor OPD Portal') + '</div></div></div>' +
        '<div class="dsh-label">WAITING ROOM · ' + S.queue.length + ' PATIENTS</div>' +
      '</div>' + sidebarItems +
      '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:8px;">' +
        '<div class="doctor-lock-btn" style="color:#E9987F;border-color:rgba(180,71,42,0.4);justify-content:center;" onclick="doctorLogout()"><span>Sign Out (Lock Portal)</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="dash-main">' +
      (active ? (
        '<div class="dash-header"><div>' +
        '<h1>' + escapeHtml(active.name) + (active.age ? ', ' + active.age : '') + '</h1>' +
        '<div class="dh-meta">' + (active.gender==='F'?'Female':active.gender==='O'?'Other':'Male') + ' · Token: ' + (active.token || '') + '</div></div>' +
        (c && c.redFlags && c.redFlags!=='None flagged.' && c.redFlags!=='None flagged' ? '<div class="redflag-pill">⚠ ' + escapeHtml(c.redFlags) + '</div>' : '') +
        '</div>' + (c ? sectionsHtml : '<div class="empty-detail">No summary details generated yet.</div>') +
        '<div class="dash-actions">' +
          '<button class="dash-btn success" onclick="callPatient(\'' + active.session_id + '\')">' + (active.status === 'in_consultation' ? 'Currently In Room ✓' : 'Approve & Call Patient') + '</button>' +
          '<button class="dash-btn ghost" onclick="saveDoctorEdits(\'' + active.session_id + '\')">Save Edits</button>' +
          '<button class="dash-btn ghost" onclick="printCaseSheet()">📄 Print / Export EMR</button>' +
          '<button class="dash-btn primary" onclick="completeVisit(\'' + active.session_id + '\')">Complete Visit ✓</button>' +
          '<button class="dash-btn danger" onclick="deletePatientRecord(\'' + active.session_id + '\')">Delete</button>' +
        '</div>'
      ) : '<div class="empty-detail">No active patients in queue.</div>') +
    '</div></div>';
}

/* ── ACTIONS ── */
async function saveDoctorEdits(sessionId){
  var fields = ['chiefComplaint', 'hpi', 'pastHistory', 'allergies', 'medications', 'familyHistory', 'reviewOfSystems', 'uploadedDocSummary'];
  var updated = {};
  for(var i=0; i<fields.length; i++){
    var el = document.getElementById('field_' + fields[i]);
    if(el) updated[fields[i]] = el.innerText.trim();
  }
  showToast('Saving edits to server...');
  var ok = await apiSaveSummary(sessionId, updated);
  if(ok){
    showToast('Edits successfully saved ✓');
    apiGetQueue();
  }
}

async function callPatient(sessionId){
  showToast('Calling patient into room...');
  var ok = await apiApprovePatient(sessionId);
  if(ok){
    showToast('Patient notified in Waiting Room ✓');
    apiGetQueue();
  }
}

async function completeVisit(sessionId){
  if(!confirm("Mark consultation complete and archive patient from queue?")) return;
  showToast('Completing consultation...');
  var ok = await apiCompletePatient(sessionId);
  if(ok){
    showToast('Visit completed and archived ✓');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

async function deletePatientRecord(sessionId){
  if(!confirm("Delete this patient from the waiting list?")) return;
  showToast('Deleting patient...');
  var ok = await apiDeletePatient(sessionId);
  if(ok){
    showToast('Patient deleted from queue');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

function printCaseSheet(){ window.print(); }

  var cw = document.getElementById('chatWindow');
  if(cw) cw.scrollTop = cw.scrollHeight;
  var ci = document.getElementById('chatInput');
  if(ci) ci.focus();
}
function setLang(l){ S.lang = l; render(); }
function setGender(g){ S.patient.gender = g; render(); }
function refreshBtn(){
  var p = S.patient;
  var isPhoneValid = !p.phone || p.phone.length === 10;
  var db = document.getElementById('detailsBtn');
  if(db) db.disabled = !(p.name.trim() && p.age && isPhoneValid);
  var cb = document.getElementById('consentBtn');
  if(cb) cb.disabled = !S.consent;
}
function goto(screen){ S.screen = screen; render(); }
function submitChat(){
  var input = document.getElementById('chatInput');
  if(!input) return;
  var val = input.value;
  input.value = '';
  sendAnswer(val);
}
function setActiveQueue(id){ S.activeQueueId = id; render(); }
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
