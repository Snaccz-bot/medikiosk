<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediKiosk — Ministry of AYUSH</title>
<style>
  :root{
    --paper:#F1F5EC;
    --paper-dim:#E7EEDF;
    --teal:#0D3B36;
    --teal-deep:#0B1A17;
    --teal-mid:#144F48;
    --saffron:#D98F2B;
    --saffron-soft:#F3D9AE;
    --sage:#6E8F6B;
    --ink:#16231D;
    --ink-soft:#4B5A50;
    --brick:#B4472A;
    --line:rgba(22,35,29,0.14);
    --line-dark:rgba(241,245,236,0.14);
    --shadow:0 1px 2px rgba(13,59,54,0.06), 0 8px 24px rgba(13,59,54,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  .serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--teal),var(--teal-mid));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:Georgia,serif;font-size:19px;font-weight:700;color:var(--teal);}
  .brand-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-2px;}
  .portal-btn{
    font-size:12.5px;color:var(--ink-soft);text-decoration:none;
    border:1px solid var(--line);padding:7px 14px;border-radius:20px;
    display:flex;align-items:center;gap:6px;cursor:pointer;background:transparent;
    transition:all .15s ease;
  }
  .portal-btn:hover{background:var(--paper-dim);color:var(--teal);}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 20px 60px;}
  .card{width:100%;max-width:490px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:34px 28px;border:1px solid var(--line);}
  .steps{display:flex;justify-content:center;gap:8px;margin:0 0 28px;}
  .step-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s ease;}
  .step-dot.active{background:var(--saffron);width:20px;border-radius:4px;}
  .step-dot.done{background:var(--sage);}

  h1.title{font-family:Georgia,serif;font-size:26px;line-height:1.25;margin:0 0 8px;color:var(--teal);}
  p.lede{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 24px;}

  /* Home Portal Cards */
  .portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  .portal-card{
    border:1.5px solid var(--line);border-radius:16px;padding:24px 18px;text-align:left;
    cursor:pointer;background:var(--paper);transition:all .2s ease;display:flex;flex-direction:column;justify-content:space-between;
  }
  .portal-card:hover{border-color:var(--teal);background:#fff;transform:translateY(-2px);box-shadow:var(--shadow);}
  .portal-card .icon-wrap{
    width:42px;height:42px;border-radius:10px;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .portal-card h3{margin:0 0 6px;font-family:Georgia,serif;font-size:17px;color:var(--teal);}
  .portal-card p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.45;}

  /* 6-Language Touch Grid */
  .lang-grid-6{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:12px;}
  @media(max-width:480px){.lang-grid-6{grid-template-columns:repeat(2, 1fr);}}
  .lang-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;
    cursor:pointer;background:var(--paper);transition:all .15s ease;
  }
  .lang-opt.selected{border-color:var(--saffron);background:var(--saffron-soft);}
  .lang-opt .lang-native{font-family:Georgia,serif;font-size:17px;color:var(--teal);font-weight:600;}
  .lang-opt .lang-eng{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;background:var(--paper);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--saffron);}
  .field-error{font-size:11.5px;color:var(--brick);margin-top:4px;font-weight:500;}

  .radio-row{display:flex;gap:8px;}
  .radio-pill{flex:1;text-align:center;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;cursor:pointer;background:var(--paper);}
  .radio-pill.selected{border-color:var(--saffron);background:var(--saffron-soft);color:var(--teal);font-weight:600;}

  .consent-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
  .check-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--saffron);flex-shrink:0;}
  .check-row span{font-size:13.5px;color:var(--ink);line-height:1.5;}

  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-mid);}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);margin-top:10px;}
  .btn-ghost:hover{background:var(--paper);}

  .chat-card{max-width:520px;}
  .chat-window{min-height:280px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;}
  .bubble.bot{background:var(--paper);color:var(--ink);border-bottom-left-radius:4px;}
  .bubble.user{background:var(--teal);color:#fff;border-bottom-right-radius:4px;margin-left:auto;}
  .typing{display:flex;gap:4px;align-self:flex-start;padding:12px 15px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:bounce 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  .input-bar{display:flex;gap:8px;align-items:center;}
  .input-bar input{flex:1;padding:13px 16px;border-radius:24px;border:1.5px solid var(--line);font-size:14.5px;background:var(--paper);}
  .input-bar input:focus{outline:none;border-color:var(--saffron);}
  .mic-btn, .send-btn{width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .mic-btn{background:var(--paper);border:1.5px solid var(--line);}
  .mic-btn.listening{background:var(--brick) !important;border-color:var(--brick) !important;animation:pulseMic 1s infinite alternate;}
  @keyframes pulseMic{from{box-shadow:0 0 0 rgba(180,71,42,0.4);}to{box-shadow:0 0 14px rgba(180,71,42,0.8);}}
  .mic-btn svg{width:18px;height:18px;stroke:var(--teal);}
  .mic-btn.listening svg{stroke:#fff !important;}
  .send-btn{background:var(--saffron);}
  .send-btn svg{width:18px;height:18px;stroke:#fff;}
  .send-btn:disabled{background:var(--line);cursor:not-allowed;}

  .dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;margin-bottom:14px;background:var(--paper);}
  .preview-row{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:12px;margin-bottom:14px;}
  .preview-row img{width:54px;height:54px;object-fit:cover;border-radius:8px;}
  .pdf-badge{width:54px;height:54px;background:#C0392B;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;}

  .gen-wrap{text-align:center;padding:40px 10px;}
  .gen-spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--saffron);margin:0 auto 20px;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Live Waiting Room Card */
  .eta-card{
    background:linear-gradient(145deg, var(--teal), var(--teal-mid));color:#fff;
    border-radius:16px;padding:22px;margin-bottom:22px;text-align:left;
  }
  .token-highlight{font-family:Georgia,serif;font-size:40px;font-weight:bold;color:var(--saffron-soft);line-height:1;}
  .eta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.15);}
  .eta-grid .val{font-size:19px;font-weight:bold;color:#fff;}
  .eta-grid .lbl{font-size:11px;color:#9FB0A5;text-transform:uppercase;letter-spacing:0.3px;}

  .recap-list{list-style:none;padding:0;margin:0 0 22px;}
  .recap-list li{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5;}
  .recap-list li:last-child{border-bottom:none;}
  .recap-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);margin-top:7px;flex-shrink:0;}

  /* Live Room Call Banner */
  .call-banner{
    background:#27ae60;color:#fff;padding:18px 20px;border-radius:14px;
    margin-bottom:20px;animation:pulseCall 1.2s infinite alternate;text-align:left;
  }
  @keyframes pulseCall{from{box-shadow:0 0 0 rgba(39,174,96,0.4);}to{box-shadow:0 0 24px rgba(39,174,96,0.85);}}

  /* Modal Dialog for Doctor Sign-in */
  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(11,26,23,0.75);
    display:flex;align-items:center;justify-content:center;z-index:1000;
  }
  .modal-card{
    background:#fff;width:100%;max-width:410px;border-radius:20px;padding:32px 28px;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .fun-error-badge{
    background:rgba(217,143,43,0.12);border:1px solid rgba(217,143,43,0.35);color:#92400e;
    padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.45;margin-bottom:16px;
    display:flex;align-items:flex-start;gap:8px;
  }

  /* Doctor Dashboard */
  .dash{display:flex;min-height:100vh;background:var(--teal-deep);color:var(--paper);}
  .dash-sidebar{width:310px;border-right:1px solid var(--line-dark);padding:24px 0;flex-shrink:0;}
  .dash-sidebar-header{padding:0 20px 18px;border-bottom:1px solid var(--line-dark);margin-bottom:10px;}
  .dash-sidebar-header .dsh-label{font-size:11px;color:var(--saffron-soft);letter-spacing:.3px;}
  .queue-item{padding:14px 20px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;transition:all .15s;}
  .queue-item:hover{background:rgba(241,245,236,0.05);}
  .queue-item.active{background:rgba(217,143,43,0.12);border-left-color:var(--saffron);}
  .queue-item .qi-name{font-size:14px;font-weight:600;}
  .queue-item .qi-meta{font-size:11.5px;color:#9FB0A5;margin-top:2px;}

  .dash-main{flex:1;padding:32px 40px;max-width:820px;}
  .dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
  .dash-header h1{font-family:Georgia,serif;font-size:26px;margin:0 0 4px;}
  .dash-header .dh-meta{font-size:13px;color:#9FB0A5;}
  .redflag-pill{background:rgba(180,71,42,0.18);color:#E9987F;border:1px solid rgba(180,71,42,0.4);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .impression-pill{background:rgba(13,59,54,0.4);color:var(--saffron-soft);border:1px solid var(--saffron);padding:12px 16px;border-radius:12px;font-size:13.5px;margin-bottom:24px;line-height:1.5;}
  
  .clinical-section{margin-bottom:22px;}
  .cs-label{font-size:11.5px;color:var(--saffron-soft);letter-spacing:.3px;margin-bottom:6px;}
  .cs-content{
    font-size:14.5px;line-height:1.6;background:rgba(241,245,236,0.04);
    border:1px solid var(--line-dark);border-radius:10px;padding:14px 16px;
    outline:none;color:var(--paper);min-height:48px;
  }
  .cs-content:focus{border-color:var(--saffron);}
  .dash-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line-dark);}
  .dash-btn{padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;}
  .dash-btn.primary{background:var(--saffron);color:var(--teal-deep);}
  .dash-btn.success{background:#27ae60;color:#fff;}
  .dash-btn.ghost{background:transparent;border:1px solid var(--line-dark);color:var(--paper);}
  .dash-btn.danger{background:transparent;border:1px solid rgba(180,71,42,0.5);color:#E9987F;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:999;}
  .toast.show{opacity:1;}
  .empty-detail{padding:60px 20px;text-align:center;color:#9FB0A5;font-size:14px;}
</style>
</head>

/* ── API CALLS ── */
async function apiDoctorLogin(docId, pin){
  try {
    var res = await fetch(BACKEND_URL + "/doctor/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doctor_id: docId, pin: pin })
    });
    if(res.ok) return await res.json();
  } catch(e){}
  return null;
}

async function apiStartSession(){
  try {
    var res = await fetch(BACKEND_URL + "/session/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: S.patient.name,
        age: String(S.patient.age),
        gender: S.patient.gender,
        phone: S.patient.phone,
        language: S.lang,
        mock_abha: S.patient.mock_abha || "91-4829-1029-4412"
      })
    });
    if(res.ok){
      var data = await res.json();
      S.sessionId = data.session_id;
      S.token = data.token;
      return true;
    }
  } catch(e){}
  S.sessionId = "local-" + Date.now();
  S.token = "B-" + (10 + Math.floor(Math.random()*40));
  return false;
}

async function apiChatNext(userMsg){
  userMsg = userMsg || "";
  try {
    var res = await fetch(BACKEND_URL + "/chat/next", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId, user_message: userMsg })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  if(!userMsg){
    return { question: t('chatTitle') + "?", done: false };
  }
  return { question: "", done: true };
}

async function apiUploadFile(file){
  try {
    var formData = new FormData();
    formData.append("file", file);
    var res = await fetch(BACKEND_URL + "/upload/document?session_id=" + encodeURIComponent(S.sessionId), {
      method: "POST",
      body: formData
    });
    if(res.ok) return (await res.json()).extracted;
  } catch(e){}
  return { summary: "Document uploaded: File attached for doctor's clinical review.", medicines: [], tests: [], date: 'Recent' };
}

async function apiGenerateSummary(){
  try {
    var res = await fetch(BACKEND_URL + "/summary/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId })
    });
    if(res.ok) return await res.json();
  } catch(e){}

  var greetings = ["hi", "hello", "hey", "hii", "k", "ok", "namaste", "h"];
  var firstUserMsg = S.messages.find(m => m.role === 'user' && !greetings.includes(m.text.toLowerCase().trim()));
  var cc = firstUserMsg ? firstUserMsg.text : "Outpatient consultation requested";
  return {
    token: S.token,
    patient_recap: [
      "Symptoms recorded for consultation.",
      "Timeline compiled for your doctor.",
      "Your case file is ready for OPD consultation."
    ],
    clinical_summary: {
      chiefComplaint: cc,
      hpi: S.messages.filter(m => m.role==='user').map(m => m.text).join('. '),
      allergies: "None reported.",
      medications: "None reported.",
      clinicalImpression: "Triage note prepared for physician review.",
      uploadedDocSummary: "No document uploaded."
    }
  };
}

function startPollingStatus(){
  if(S.statusTimer) clearInterval(S.statusTimer);
  S.statusTimer = setInterval(async function(){
    if(!S.sessionId || S.view !== 'kiosk' || S.screen !== 'recap') return;
    try {
      var res = await fetch(BACKEND_URL + "/session/" + S.sessionId + "/status");
      if(res.ok){
        var data = await res.json();
        S.currentTokenInRoom = data.current_token_in_room || "None in room";
        S.patientsAhead = data.patients_ahead || 0;
        S.estWaitMinutes = data.est_wait_minutes || 0;

        if(data.status === 'in_consultation' && !S.calledIn){
          S.calledIn = true;
          S.roomName = data.room || "OPD Consultation Room 2";
          playChime();
        }
        render();
      }
    } catch(e){}
  }, 2500);
}

function playChime(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch(e){}
}

/* ── FLOW CONTROLLERS ── */
function onPhoneInput(el){
  var val = el.value.replace(/\D/g, '');
  if(val.length > 10) val = val.slice(0, 10);
  el.value = val;
  S.patient.phone = val;
  if(val.length > 0 && val.length < 10){
    S.phoneError = S.lang==='hi' ? 'फ़ोन नंबर पूरे 10 अंकों का होना चाहिए' : 'Phone number must be exactly 10 digits';
  } else {
    S.phoneError = '';
  }
  var errEl = document.getElementById('phoneErr');
  if(errEl) errEl.innerText = S.phoneError;
  refreshBtn();
}

async function beginChat(){
  S.screen = 'chat'; S.messages = []; S.chatDone = false; render();
  await apiStartSession();
  S.awaitingReply = true; render();
  var res = await apiChatNext("");
  if(res && res.question){
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function sendAnswer(text){
  if(!text.trim() || S.awaitingReply) return;
  S.messages.push({ role:'user', text: text.trim() });
  S.awaitingReply = true; render();

  var res = await apiChatNext(text.trim());
  if(res.done || !res.question){
    S.chatDone = true;
  } else {
    S.messages.push({ role:'bot', text: res.question });
  }
  S.awaitingReply = false; render();
}

async function onFileChosen(ev){
  var file = ev.target.files[0];
  if(!file) return;

  S.uploadFile = file;
  S.uploadFileName = file.name;
  S.uploadIsPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  S.uploadStatus = 'scanning';
  render();

  if(!S.uploadIsPdf){
    var reader = new FileReader();
    reader.onload = function(e){ S.uploadPreview = e.target.result; render(); };
    reader.readAsDataURL(file);
  } else {
    S.uploadPreview = null;
    render();
  }

  var extracted = await apiUploadFile(file);
  S.extracted = extracted;
  S.uploadStatus = 'done';
  render();
}

async function generateSummary(){
  S.screen = 'generating'; render();
  var res = await apiGenerateSummary();
  S.clinicalSummary = res.clinical_summary;
  S.patientRecap = res.patient_recap || [];
  if(res.token) S.token = res.token;

  S.activeQueueId = S.sessionId;
  S.screen = 'recap';
  startPollingStatus();

/* ── SPEECH RECOGNITION (STREAMING REAL-TIME INPUT) ── */
function toggleMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("Microphone not supported in this browser. Please use Chrome."); return; }
  
  var micBtn = document.getElementById('micBtn');
  var input = document.getElementById('chatInput');
  if(!input) return;

  if(S.listening){
    if(S.recognition) { try { S.recognition.stop(); } catch(e){} }
    S.listening = false;
    if(micBtn) micBtn.classList.remove('listening');
    return;
  }

  var rec = new SR();
  var speechLangMap = {
    'en': 'en-IN', 'hi': 'hi-IN', 'ta': 'ta-IN',
    'ml': 'ml-IN', 'gu': 'gu-IN', 'bn': 'bn-IN'
  };
  rec.lang = speechLangMap[S.lang] || 'en-IN';
  rec.continuous = false;
  rec.interimResults = true;

  rec.onstart = function(){
    S.listening = true;
    if(micBtn) micBtn.classList.add('listening');
    showToast("Listening... speak your symptoms");
  };

  rec.onend = function(){
    S.listening = false;
    if(micBtn) micBtn.classList.remove('listening');
  };

  rec.onerror = function(e){
    S.listening = false;
    if(micBtn) micBtn.classList.remove('listening');
  };

  rec.onresult = function(ev){
    var transcript = '';
    for (var i = 0; i < ev.results.length; ++i) {
      transcript += ev.results[i][0].transcript;
    }
    input.value = transcript;
  };

  S.recognition = rec;
  try {
    rec.start();
  } catch(e){
    showToast("Mic start failed");
  }
}

function showToast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

async function saveDoctorEdits(sessionId){
  var fields = ['chiefComplaint', 'hpi', 'allergies', 'medications', 'uploadedDocSummary'];
  var updated = {};
  for(var i=0; i<fields.length; i++){
    var el = document.getElementById('field_' + fields[i]);
    if(el) updated[fields[i]] = el.innerText.trim();
  }
  showToast('Saving edits to server...');
  var ok = await apiSaveSummary(sessionId, updated);
  if(ok){
    showToast('Edits successfully saved ✓');
    apiGetQueue();
  }
}

async function callPatient(sessionId){
  showToast('Calling patient into room...');
  var ok = await apiApprovePatient(sessionId);
  if(ok){
    showToast('Patient notified and called in ✓');
    apiGetQueue();
  }
}

async function completeVisit(sessionId){
  if(!confirm("Mark consultation complete and archive patient from queue?")) return;
  showToast('Completing consultation...');
  var ok = await apiCompletePatient(sessionId);
  if(ok){
    showToast('Visit completed and archived ✓');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

async function deletePatientRecord(sessionId){
  if(!confirm("Are you sure you want to delete this patient from the waiting list?")) return;
  showToast('Deleting patient...');
  var ok = await apiDeletePatient(sessionId);
  if(ok){
    showToast('Patient deleted from queue');
    S.activeQueueId = null;
    apiGetQueue();
  }
}

  var p = S.patient;
  // STRICTLY MANDATORY 10-digit mobile number requirement
  var isPhoneValid = p.phone && p.phone.length === 10;
  var ready = p.name.trim().length > 0 && p.age.trim().length > 0 && isPhoneValid;
  var db = document.getElementById('detailsBtn');
  if(db) db.disabled = !ready;
  var cb = document.getElementById('consentBtn');
  if(cb) cb.disabled = !S.consent;
}
function goto(screen){ S.screen = screen; render(); }
function submitChat(){
  var input = document.getElementById('chatInput');
  if(!input) return;
  var val = input.value;
  input.value = '';
  sendAnswer(val);
}
function goHome(){
  S.view = 'landing';
  S.screen = 'welcome';
  if(S.statusTimer) clearInterval(S.statusTimer);
  render();
}
function setActiveQueue(id){ S.activeQueueId = id; render(); }
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
